preset:
  name: allow-local
  description: Allow local network access for Proxy
network_policies:
  allow-local:
    name: allow-local
    endpoints:
      - host: host.openshell.internal
        port: 80
        access: full
        protocol: rest
      - host: host.docker.internal
        port: 80
        access: full
        protocol: rest
      - host: wttr.in
        port: 80
        access: full
      - host: wttr.in
        port: 443
        access: full
